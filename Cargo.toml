[package]
name = "scanf"
description = "Parse text inputs (inverse of print! and format!)"
version = "2.2.0"
keywords = ["scanf", "sscanf", "parsing", "macro", "format"]
categories = ["parsing", "text-processing"]
readme = "README.md"
license = "Unlicense"
authors = ["Jesus Hernandez <jesushdez@protonmail.com>"]
repository = "https://github.com/jhg/scanf-rs"
exclude = [
    ".github/**",
    ".vscode/**",
    ".idea/**",
    "benches/**",
    "Cargo.lock",
    ".gitignore",
]
edition = "2024"
rust-version = "1.85"

[lib]
proc-macro = true
bench = false

[features]
default = []
# Retry failed parses with surrounding whitespace trimmed (e.g. `" 42 "` into an integer).
# Strings are unaffected: they never fail to parse, so they keep their whitespace.
trim-whitespace = []
# Ignore input left over after the last literal text of the format (`"{} units"` accepts
# `"5 units extra"`). By default that input is an error.
ignore-trailing-input = []

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", features = ["derive", "parsing", "proc-macro"] }

[dev-dependencies]
criterion = "0.8.2"

[[test]]
name = "stdin"
harness = false

[[bench]]
name = "benchmark"
harness = false

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
strip = true
debug-assertions = false
codegen-units = 1
incremental = false
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
