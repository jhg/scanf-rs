name: Security audit

on:
  schedule:
    - cron: "0 0 * * 1" # At 00:00 on Monday.
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    permissions:
      contents: read
      checks: write # Report audit results.
      issues: write # Open issues for scheduled security advisories.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable
        uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
