name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "doc/**"
      - ".vscode/**"
      - ".gitignore"
      - "**/*.md"
      - "*.code-workspace"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  version_check:
    runs-on: ubuntu-latest
    outputs:
      releaseVersion: ${{steps.version_check.outputs.releaseVersion}}
      versionChanged: ${{steps.version_check.outputs.versionChanged}}
    steps:
      - uses: actions/checkout@v2
      - run: git fetch --all --tags
      - name: Check Release Version
        uses: thebongy/version-check@v1
        id: version_check
        with:
          failBuild: false
          file: Cargo.toml
          tagFormat: v${version}

  audit:
    permissions:
      contents: read
      checks: write # Report audit results.
      issues: write # Open issues for scheduled security advisories.
    uses: ./.github/workflows/audit.yml

  tests:
    permissions:
      contents: read
      pull-requests: write # Allow the reusable benchmark job to comment on PRs.
    uses: ./.github/workflows/tests.yml

  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [audit, tests, version_check]
    if: ${{needs.version_check.outputs.versionChanged == 'true'}}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: Swatinem/rust-cache@v1
      - name: Publish to crates.io
        run: cargo publish --verbose
      - name: Release & tag
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{needs.version_check.outputs.releaseVersion}}"
          target_commitish: "${{ github.sha }}"
