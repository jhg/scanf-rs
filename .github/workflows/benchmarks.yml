name: Benchmarks

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  benchmark:
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - name: Install latest stable
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: Swatinem/rust-cache@v1
      - name: Build benchmarks
        run: cargo bench --bench benchmark --no-run
      - name: Run benchmarks
        uses: boa-dev/criterion-compare-action@v3
        with:
          benchName: benchmark
          branchName: ${{ github.base_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
